<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="sustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005a36"/>
      <stop offset="100%" stop-color="#003822"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circular SUST Seal/Emblem on Left -->
  <g transform="translate(40, 40)" filter="url(#shadow)">
    <!-- Outer Green Ring -->
    <circle cx="0" cy="0" r="34" fill="url(#sustGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Inner White Circle -->
    <circle cx="0" cy="0" r="28" fill="#ffffff"/>
    <circle cx="0" cy="0" r="26.5" stroke="#005a36" stroke-width="0.8" fill="none"/>
    
    <!-- Central Emblem Elements -->
    <!-- Red Sun Circle -->
    <circle cx="0" cy="-6" r="10" fill="#f42a41"/>
    <!-- Academic Open Book & Gear Symbol -->
    <path d="M-12 8 Q0 2 12 8 Q0 4 -12 8 Z" fill="#005a36"/>
    <path d="M-12 8 L-12 14 Q0 9 12 14 L12 8 Q0 3 -12 8 Z" fill="#0284c7" opacity="0.85"/>
    <!-- Gold Flame / Star of Science -->
    <polygon points="0,-14 3,-7 10,-7 4,-3 6,4 0,0 -6,4 -4,-3 -10,-7 -3,-7" fill="#fbbf24"/>
    
    <!-- SUST Text Arc Indicator -->
    <text x="0" y="21" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="6.5px" font-weight="800" fill="#005a36" letter-spacing="0.5px">SUST</text>
  </g>

  <!-- Institutional Typography on Right -->
  <g transform="translate(86, 0)">
    <text x="0" y="28" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13px" font-weight="800" fill="#004d2e" letter-spacing="-0.2px">SUST</text>
    <text x="42" y="28" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5px" font-weight="700" fill="#0f172a">Shahjalal University of</text>
    <text x="0" y="44" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5px" font-weight="700" fill="#0f172a">Science and Technology</text>
    <text x="0" y="60" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9px" font-weight="600" fill="#2563eb" letter-spacing="0.2px">Dept. of Computer Science &amp; Engineering</text>
  </g>
</svg>
